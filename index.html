<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英文單字自主練習</title>
<style>
:root{--fg:#514746;--mu:#958986;--pr:#574B49;--bd:#D8CECA;--ln:#E9E1DE;--soft:#FAF7F5;--y:#FFF1BE;--p:#FBE3E6;--v:#ECE5F6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:16px 18px 24px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.hd{display:flex;gap:14px;align-items:center;padding:6px 0 16px}
.logo{width:54px;height:54px;border-radius:15px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:21px;flex:none}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.04em}h2{font-size:20px;margin:6px 0 14px}.sub{color:var(--mu);font-size:14px}
.sch{width:100%;border:1.5px solid var(--pr);background:var(--soft);border-radius:999px;padding:13px 20px;font-size:16px;outline:none}
.sec{border-top:1px solid var(--ln);padding:18px 0;margin-top:16px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:17px}
.sh .t{flex:1;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.sh small{font-weight:400;color:var(--mu);font-size:14px}
.nb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none}
.lb{font-size:14px;color:var(--mu);margin:14px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:1.5px solid var(--pr);background:#fff;color:var(--pr);border-radius:999px;padding:10px 18px;font-size:16px;min-height:46px}
.pill.on,.btn{background:var(--pr);color:#fff}
.pill.s{padding:6px 14px;min-height:36px;font-size:14px}
.pill:disabled{border-color:var(--bd);color:var(--mu);background:#fff;cursor:default}
.btn{border:1.5px solid var(--pr);border-radius:999px;padding:12px 24px;font-size:17px;min-height:48px}
.btn.w{width:100%;font-size:18px}.btn:disabled{background:var(--ln);border-color:var(--ln);color:var(--mu)}
.hint{font-size:13px;color:var(--mu);line-height:1.6}
.card{background:var(--soft);border:1px solid var(--ln);border-radius:20px;padding:22px 16px;margin-bottom:14px;text-align:center}
.big{font-size:38px;line-height:1.3;margin:8px 0;word-break:break-word}.zh{color:var(--mu);font-size:17px;margin:4px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:15px;margin-bottom:10px}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--pr)}
.opt{display:block;width:100%;background:#fff;border:1.5px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:10px;font-size:19px}
.opt.ok{background:var(--y);border-color:var(--pr)}.opt.no{background:var(--p);border-color:var(--pr)}
.fb{border-radius:16px;padding:14px 16px;margin:12px 0;line-height:1.7}.fb.ok{background:var(--y)}.fb.no{background:var(--p)}
.foot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;background:#fff;border-top:1px solid var(--ln);padding:12px 0;margin-top:14px}
.foot .btn{flex:1}.foot .pill{flex:none}
.slot{min-height:58px;border:1.5px dashed var(--bd);border-radius:16px;padding:8px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.in{width:100%;font-size:24px;text-align:center;padding:14px;border-radius:18px;border:1.5px solid var(--bd);background:#fff;outline:none}
textarea{width:100%;height:280px;border:1.5px solid var(--bd);border-radius:16px;padding:12px;font:14px/1.6 ui-monospace,Menlo,monospace;background:var(--soft);color:var(--fg)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;color:var(--mu);font-size:14px}.st b{display:block;font-size:28px;color:var(--fg)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:15px}
.res{margin-top:6px;border:1px solid var(--ln);border-radius:16px;padding:4px 14px}
.wc{border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-bottom:12px;background:#fff;text-align:left}
.wh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wd{font-size:26px;font-weight:700}
.tg{background:var(--v);border-radius:999px;padding:2px 10px;font-size:13px}
.wz{font-size:18px;margin:4px 0 8px}
.ex{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.7;margin-bottom:8px}
.rl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:14px}
.rl em{font-style:normal;color:var(--mu);margin-right:2px}
.rl button{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px}
.loc{margin-top:8px;font-size:13px;background:var(--y);border-radius:999px;display:inline-block;padding:3px 12px}
.ug{display:flex;align-items:center;gap:10px;margin:16px 0 10px}.ug b{background:var(--pr);color:#fff;border-radius:999px;padding:4px 14px;font-size:14px}.ug span{color:var(--mu);font-size:14px}
.bl{border-bottom:2px solid var(--pr);font-weight:700;white-space:nowrap;text-decoration:none}
.gf{background:var(--v);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:600;line-height:1.6;font-size:15px}.tp{font-size:14px;line-height:1.7;margin:4px 0}
.md{position:fixed;inset:0;background:rgba(81,71,70,.35);display:grid;place-items:center;z-index:9;padding:20px}.md>div{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center}
@media(min-width:860px){.ov{grid-column:1/-1}#app{max-width:980px}.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:44px}.grid .sec:nth-child(-n+2){margin-top:16px}}
</style>
</head>

  if(t==='qa')for(let i=0;i<qs.length;i+=9)pg(hd('（解答）'),qs.slice(i,i+9).map((q,j)=>`<div style="margin-bottom:10px;font-size:14px;line-height:1.6"><b>${i+j+1}. ${L[q.ans]}</b>　${esc(q.o[q.ans])}<br><span style="color:#958986">${esc(q.exp)}</span></div>`).join(''));
  return out.join('');
}
