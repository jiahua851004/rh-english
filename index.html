<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英文單字自主練習</title>
<style>
:root{--fg:#514746;--mu:#958986;--pr:#574B49;--bd:#D8CECA;--ln:#E9E1DE;--soft:#FAF7F5;--y:#FFF1BE;--p:#FBE3E6;--v:#ECE5F6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:16px 18px 24px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.hd{display:flex;gap:14px;align-items:center;padding:6px 0 16px}
.logo{width:54px;height:54px;border-radius:15px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:21px;flex:none}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.04em}h2{font-size:20px;margin:6px 0 14px}.sub{color:var(--mu);font-size:14px}
.sch{width:100%;border:1.5px solid var(--pr);background:var(--soft);border-radius:999px;padding:13px 20px;font-size:16px;outline:none}
.sec{border-top:1px solid var(--ln);padding:18px 0;margin-top:16px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:17px}
.sh .t{flex:1;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.sh small{font-weight:400;color:var(--mu);font-size:14px}
.nb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none}
.lb{font-size:14px;color:var(--mu);margin:14px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:1.5px solid var(--pr);background:#fff;color:var(--pr);border-radius:999px;padding:10px 18px;font-size:16px;min-height:46px}
.pill.on,.btn{background:var(--pr);color:#fff}
.pill.s{padding:6px 14px;min-height:36px;font-size:14px}
.pill:disabled{border-color:var(--bd);color:var(--mu);background:#fff;cursor:default}
.btn{border:1.5px solid var(--pr);border-radius:999px;padding:12px 24px;font-size:17px;min-height:48px}
.btn.w{width:100%;font-size:18px}.btn:disabled{background:var(--ln);border-color:var(--ln);color:var(--mu)}
.hint{font-size:13px;color:var(--mu);line-height:1.6}
.card{background:var(--soft);border:1px solid var(--ln);border-radius:20px;padding:22px 16px;margin-bottom:14px;text-align:center}
.big{font-size:38px;line-height:1.3;margin:8px 0;word-break:break-word}.zh{color:var(--mu);font-size:17px;margin:4px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:15px;margin-bottom:10px}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--pr)}
.opt{display:block;width:100%;background:#fff;border:1.5px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:10px;font-size:19px}
.opt.ok{background:var(--y);border-color:var(--pr)}.opt.no{background:var(--p);border-color:var(--pr)}
.fb{border-radius:16px;padding:14px 16px;margin:12px 0;line-height:1.7}.fb.ok{background:var(--y)}.fb.no{background:var(--p)}
.foot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;background:#fff;border-top:1px solid var(--ln);padding:12px 0;margin-top:14px}
.foot .btn{flex:1}.foot .pill{flex:none}
.slot{min-height:58px;border:1.5px dashed var(--bd);border-radius:16px;padding:8px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.in{width:100%;font-size:24px;text-align:center;padding:14px;border-radius:18px;border:1.5px solid var(--bd);background:#fff;outline:none}
textarea{width:100%;height:280px;border:1.5px solid var(--bd);border-radius:16px;padding:12px;font:14px/1.6 ui-monospace,Menlo,monospace;background:var(--soft);color:var(--fg)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;color:var(--mu);font-size:14px}.st b{display:block;font-size:28px;color:var(--fg)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:15px}
.res{margin-top:6px;border:1px solid var(--ln);border-radius:16px;padding:4px 14px}
.wc{border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-bottom:12px;background:#fff;text-align:left}
.wh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wd{font-size:26px;font-weight:700}
.tg{background:var(--v);border-radius:999px;padding:2px 10px;font-size:13px}
.wz{font-size:18px;margin:4px 0 8px}
.ex{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.7;margin-bottom:8px}
.rl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:14px}
.rl em{font-style:normal;color:var(--mu);margin-right:2px}
.rl button{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px}
.loc{margin-top:8px;font-size:13px;background:var(--y);border-radius:999px;display:inline-block;padding:3px 12px}
.ug{display:flex;align-items:center;gap:10px;margin:16px 0 10px}.ug b{background:var(--pr);color:#fff;border-radius:999px;padding:4px 14px;font-size:14px}.ug span{color:var(--mu);font-size:14px}
.bl{border-bottom:2px solid var(--pr);font-weight:700;white-space:nowrap;text-decoration:none}
.gf{background:var(--v);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:600;line-height:1.6;font-size:15px}.tp{font-size:14px;line-height:1.7;margin:4px 0}
.md{position:fixed;inset:0;background:rgba(81,71,70,.35);display:grid;place-items:center;z-index:9;padding:20px}.md>div{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center}
@media(min-width:860px){.ov{grid-column:1/-1}#app{max-width:980px}.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:44px}.grid .sec:nth-child(-n+2){margin-top:16px}}
</style>
</head>

@頻率副詞的位置|頻率副詞：always、usually、often、sometimes、seldom、never。放 be 動詞之後、一般動詞之前、助動詞與原形動詞之間。|be 動詞＋頻率副詞／頻率副詞＋一般動詞／助動詞＋頻率副詞＋原形動詞

@頻率副詞的程度與語氣|頻率由高到低：always (100%) > usually > often > sometimes > seldom > never (0%)。seldom、never 本身有否定意思，不能再和 not 連用。not always 表示「不一定總是」，等於 sometimes。sometimes 位置最彈性，可放句首、句中或句尾。|always > usually > often > sometimes > seldom > never／not always = sometimes

!只有 sometimes 可以放句首或句尾。

@疑問詞 which 的用法|which 表示「哪一個」，用在已知範圍內選擇，範圍常明白列出：Which do you like, A or B?。彼此看得到時也可省略選項：Which do you want?。which 問句不能用 yes / no 回答。|Which＋do / does＋主詞＋原形 V, A or B?／回答：主詞＋V＋選擇

@過去進行式的意義與形成|過去進行式表示過去某個時間點，或某一段時間「正在進行」的動作。形式是 was / were＋V-ing。|I / he / she / it＋was＋V-ing／you / we / they＋were＋V-ing

@從屬連接詞 if（如果）：現在式代替未來式|If 子句表示條件。條件是未來可能發生的事時，if 子句用現在式；主要子句用未來式（will / be going to）、情態助動詞（can、may）或祈使句。|If＋主詞＋現在式, 主詞＋will / can / may＋原形 V／祈使句

@被動語態的意義與形成（現在式與過去式）|主詞是動作的接受者時用被動語態：be 動詞＋過去分詞（P.P.）。現在式用 am / is / are＋P.P.，過去式用 was / were＋P.P.；動作者用 by 帶出，可省略。|現在：am / is / are＋P.P.＋(by 人)／過去：was / were＋P.P.＋(by 人)

@被動語態的未來式、完成式與含助動詞|未來式被動：will be＋P.P. 或 be going to be＋P.P.；現在完成式被動：have / has been＋P.P.；有助動詞時：助動詞＋be＋P.P.。|will be＋P.P.／be going to be＋P.P.／have / has been＋P.P.／助動詞＋be＋P.P.

!主詞單數用 has been，複數用 have been。

@間接問句的語序|直接問句放在句子中當受詞時，變成間接問句（名詞子句）。語序是：主要子句＋wh-疑問詞＋主詞＋動詞。主詞和 be 動詞／助動詞不能倒裝。|主要子句＋wh-＋主詞＋動詞

@介系詞片語後位修飾|介系詞片語（with、in、on、at、about 等＋名詞）可放在名詞後面修飾它，說明那個名詞是哪一個或什麼樣的。|名詞＋介系詞片語（with / in / on / at / about...）

!修飾主詞時，句型為：主詞＋介系詞片語＋動詞（The man at the door is my uncle.）。
!動詞要和被修飾的名詞（主詞）的單複數一致，不是和介系詞片語裡的名詞一致。

@in 與 with 的選擇（衣物、飾品、外貌）|穿在身上的衣物用 in（in a blue jacket）；眼鏡、領帶、手錶等配件，以及外貌特徵用 with（with glasses、with long hair）。cap 和 hat 可用 in 或 with。|穿著衣服：in＋衣物／配件、外貌：with＋名詞

@關係代名詞當主詞的關係子句|關係子句是形容詞子句，放在名詞（先行詞）後面修飾它。關係代名詞當主詞時：人用 who / that，物用 which / that。關係代名詞當主詞時不可省略。|先行詞＋who / which / that＋V...

!關代當主詞時，後面直接接動詞，不可省略。
!who / which 後面不能再加主詞（錯：who he is dancing）。

@關係子句的動詞單複數與先行詞「人＋物」|關係子句的動詞由先行詞決定單複數：先行詞單數用單數動詞，複數用複數動詞。先行詞同時有人和物時，關代用 that。|先行詞單數→V-s／先行詞複數→V原／人＋物→that

@when 與過去進行式|過去進行式（was / were＋V-ing）表示過去某時刻正在進行的動作；when 引導的子句用過去簡單式，表示另一個短暫事件發生的時間。|S＋was / were＋V-ing＋when＋S＋V-ed／When＋S＋V-ed, S＋was / were＋V-ing

@副詞子句：從屬連接詞的意義|常見從屬連接詞：because（因為）、although（雖然）、until（直到）、when / while（當…時）、before（在…之前）、after（在…之後）、since（自從）、if（如果）。副詞子句修飾整個句子。|because 原因／although 讓步／until 直到／when, while 時間／before, after 先後／since 自從／if 條件

  app.innerHTML=`<div class="hd"><div class="logo">Aa</div><div><h1>文法總覽</h1><div class="sub">範例題附解答，和練習題不同。</div></div></div>
  <div class="pills" style="margin:0 0 12px"><button class="pill" data-a="home">← 返回文法首頁</button></div>
  ${gsbox()}
  <div class="sec ov"><div class="sh"><div class="t">已選範圍<small>${ts.length} 個主題</small></div><button class="btn" data-a="home" style="padding:8px 18px;min-height:40px;font-size:15px">去練習</button></div>
  ${grp.size?[...grp].map(([k,a])=>`<div class="ug"><b>${esc(k)}</b><span>${a.length} 個主題</span></div>`+a.map(t=>gcard(t,true)).join('')).join(''):'<p class="hint">還沒選範圍，請回文法首頁選擇課次；或直接用上方搜尋查詢。</p>'}</div>`;
  gsrch();
}
function ghome(){
  Q=null;
  const gs=GR,bs=uniq(GT.filter(t=>t.g===GS.g).map(t=>t.b));if(!bs.includes(GS.b))GS.b=bs[0]||'';
  const us=uniq(GT.filter(t=>t.g===GS.g&&t.b===GS.b).map(t=>t.u));
  const ts=gsel(),nq=gqs(ts).length,nt=ts.length;
  const hs=ST.h.filter(h=>h.m==='gram'),avg=hs.length?Math.round(hs.reduce((a,h)=>a+h.ok,0)/hs.reduce((a,h)=>a+h.n,0)*100):0;
  const un=Object.keys(ST.gm).filter(id=>GQ[id]&&!ST.gmf[id]).length,nof=ts.filter(t=>!ST.gf[t.name]).length;
  app.innerHTML=`<div class="hd"><div class="logo">Aa</div><div><h1>英文文法自主練習</h1><div class="sub">先看文法重點，再用選擇題練習。</div></div></div>${tabs()}
  ${gsbox()}
  <div class="grid">
  <div class="sec">
    <div class="sh">${nbadge(1,'--y')}<div class="t">範圍<small>${esc(GS.g)}・${esc(GS.b)}</small></div><button class="pill on s" data-a="gopn">${GS.open?'收合':'展開'}</button></div>
    ${GS.open?`<div class="lb">年級</div><div class="pills">${gs.map(g=>pill('ggrade',g,g,g===GS.g)).join('')}</div>
    ${bs.length?`<div class="lb">冊別</div><div class="pills">${bs.map(b=>pill('gbook',b,b,b===GS.b)).join('')}</div>
    <div class="lb">課次（可多選）</div><div class="pills">${us.map(u=>pill('gunit',u,u,GS.sel.has(['翰林',GS.g,GS.b,u].join('|')))).join('')}</div>
    <div class="pills" style="margin-top:12px"><button class="pill s" data-a="gallb">全選整冊</button><button class="pill s" data-a="gclrb">清除本冊</button></div>`:'<p class="hint">這個年級的文法內容還在準備中，這個年級的文法內容還在準備中，請先選已開放的範圍。</p>'}`:''}
    <p class="hint" style="margin:12px 0 0">已選 <b>${nt}</b> 個文法主題、<b>${nq}</b> 題</p>
  </div>
  <div class="sec"><div class="sh">${nbadge(2,'--v')}<div class="t">文法總覽<small>${nt} 個主題・${ts.reduce((a,t)=>a+t.eq.length,0)} 題範例</small></div></div>
    <p class="hint" style="margin:0 0 10px">練習前先複習重點與範例題（附解答）。</p><button class="btn w" data-a="govw">查看文法總覽 📖</button>
  </div>
  <div class="sec"><div class="sh">${nbadge(3,'--p')}<div class="t">練習設定</div></div>
    <div class="lb" style="margin-top:0">題目數量</div><div class="pills">${[6,12,18,24].map(k=>pill('gn',k,k+' 題',GS.n===k)).join('')}</div>
    <div class="lb">難度</div><div class="pills">${[['all','全部'],['基礎','基礎題'],['變化','變化題（會考風）']].map(([k,t])=>pill('glv',k,t,GS.lv===k)).join('')}</div>
    <div class="lb">選項</div><div class="pills">${pill('gtg','rand','隨機抽題',GS.rand)}${pill('gtg','hint','顯示主題提示',GS.hint)}</div>
    <p class="hint">此範圍的${GS.lv==='all'?'':GS.lv+'題'}最多可出 ${nq} 題${nof?`。還有 ${nof} 個主題尚未標記熟悉，建議先看複習卡`:''}</p>
    <button class="btn w" data-a="ggo">開始練習 ▶</button>
  </div>
  <div class="sec"><div class="sh">${nbadge(4,'--y')}<div class="t">個人學習紀錄</div></div>
    <div class="st"><div><b>${hs.length}</b>練習次數</div><div><b>${avg}%</b>平均正確率</div><div><b>${un}</b>待複習錯題</div></div>
    <div class="pills" style="margin-top:14px"><button class="pill" data-a="gnb">文法錯題本</button><button class="pill" data-a="gws">學習單 PDF</button></div>
    <p class="hint" style="margin-top:10px">紀錄只存在這支手機的瀏覽器。</p>
  </div></div>`;
  gsrch();
}
function grun(items){Q={m:'gram',items,i:0,rec:[],t0:Date.now()};gask()}
function ggo(){
  const ts=gsel();let p=gqs(ts),n=GS.n;
  if(!p.length){dlg('此範圍沒有可用的題目，請調整範圍或難度',[['好',0]]);return}
  if(GS.rand)p=shuffle(p);
  if(p.length<n){const k=p.length;dlg(`此範圍只有 ${k} 題可用，要改成 ${k} 題開始嗎？`,[['改選範圍',0],['開始 '+k+' 題',()=>grun(p)]]);return}
  grun(p.slice(0,n));
}
function gask(){
  if(Q.i>=Q.items.length)return finish();
  if(Q.rec[Q.i])return grview(Q.i);
  const c=Q.c=Q.items[Q.i];Q.o=shuffle(c.o.map((t,i)=>({t,ok:i===c.ans})));
  let h=head()+`<div class="card" style="text-align:left"><div class="zh" style="text-align:center">選出正確答案</div><div style="font-size:21px;line-height:1.8;margin-top:8px">${gstem(c.stem)}</div>${GS.hint?`<div class="zh" style="text-align:center;margin-top:8px;font-size:14px">主題：${esc(c.t.name)}</div>`:''}</div>`;
  h+=Q.o.map((o,i)=>`<button class="opt" data-a="gopt" data-v="${i}">${esc(o.t)}</button>`).join('');
  app.innerHTML=h+'<div id="fbx"></div>'+foot(nl(),'fnext',true);
}
function gexp(c,ok,ans){
  const f=gfill(c);
  return `<div class="fb ${ok?'ok':'no'}">${ok?'✅ 答對了！':'❌ 再看一次正確答案'}<br>正確答案：<b>${esc(c.o[c.ans])}</b>${ok?'':'<br>你的答案：'+esc(ans)}<br>${esc(c.exp)}</div><div class="row"><button class="pill" data-a="gtopic" data-v="${c.t.id}">📖 回看這個文法</button>${f?say(f,'聽句子'):''}</div>`;
}
function gfb(ok,ans){
  const c=Q.c;Q.rec[Q.i]={c,ok,ans,o:Q.o};
  if(!ok){const r=ST.gm[c.id]||(ST.gm[c.id]={id:c.id,n:0});r.n++;delete ST.gmf[c.id]}
  sv();
  const x=document.getElementById('fbx');x.innerHTML=gexp(c,ok,ans);
  const n=document.getElementById('nx');n.disabled=false;n.dataset.a='fnext';n.textContent=nl();
  const f=gfill(c);if(f)speak(f);x.scrollIntoView({block:'nearest'});
}
function grview(k){
  const r=Q.rec[k],c=r.c;
  app.innerHTML=head()+`<div class="card" style="text-align:left"><div style="font-size:21px;line-height:1.8">${gstem(c.stem)}</div></div>`+r.o.map(o=>`<button class="opt${o.ok?' ok':(o.t===r.ans?' no':'')}" disabled>${esc(o.t)}</button>`).join('')+gexp(c,r.ok,r.ans)+foot(nl(),'fnext',false);
}
function gfinish(){
  const sec=Math.round((Date.now()-Q.t0)/1000),n=Q.rec.length,ok=Q.rec.filter(r=>r.ok).length,wr=n-ok;
  ST.h.unshift({t:Date.now(),m:'gram',n,ok,sec});ST.h=ST.h.slice(0,30);sv();
  const sh=s=>{s=s.replace(/___/g,'＿＿');return s.length>38?s.slice(0,38)+'…':s};
  app.innerHTML=`<h2>🎉 文法練習完成</h2><div class="card"><div class="big" style="font-size:52px">${n?Math.round(ok/n*100):0}%</div><div class="zh">正確率</div><div class="st" style="margin-top:14px"><div><b>${n}</b>總題數</div><div><b>${ok}</b>答對</div><div><b>${wr}</b>答錯</div></div><div class="zh" style="margin-top:12px;font-size:14px">作答時間 ${Math.floor(sec/60)} 分 ${sec%60} 秒</div></div>
  <div class="pills" style="justify-content:center">${wr?'<button class="btn" data-a="gretest">重測錯題</button>':''}<button class="pill" data-a="ggo">再練一次</button><button class="pill" data-a="gnb">文法錯題本</button><button class="pill" data-a="home">回首頁</button></div>
  <div class="sec"><div class="sh">逐題檢討</div>${Q.rec.map(r=>`<div class="li" style="align-items:flex-start"><span>${r.ok?'✅':'❌'} <b>${esc(r.c.t.name)}</b><br><span class="hint">${esc(sh(r.c.stem))}</span>${r.ok?'':`<br><span class="hint">正確：${esc(r.c.o[r.c.ans])}</span>`}</span><button class="pill s" data-a="gtopic" data-v="${r.c.t.id}" style="flex:none">📖 文法</button></div>`).join('')}</div>`;
  scrollTo(0,0);
}
function gnb(){
  const ms=Object.values(ST.gm).filter(x=>GQ[x.id]).sort((a,b)=>b.n-a.n),un=ms.filter(x=>!ST.gmf[x.id]);
  const g=new Map();ms.forEach(x=>{const q=GQ[x.id],k=q.t.id;(g.get(k)||g.set(k,[]).get(k)).push([x,q])});
  const hs=ST.h.filter(h=>h.m==='gram');
  app.innerHTML=`<h2>📕 文法錯題本</h2><div class="top"><span>共 ${ms.length} 題，未熟悉 ${un.length} 題</span></div>
  ${un.length?'<button class="btn w" data-a="grtnb">重測未熟悉的錯題</button>':''}
  <div class="sec">${ms.length?[...g].map(([ti,a])=>`<div class="ug"><b>${esc(GT[ti].name)}</b><span>${a.length} 題</span><button class="pill s" data-a="gtopic" data-v="${ti}" style="margin-left:auto">📖 文法</button></div>`+a.map(([x,q])=>`<div class="wc"><div style="font-size:16px;line-height:1.7">${ST.gmf[x.id]?'⭐ ':''}${gstem(q.stem)}</div><div class="hint" style="margin-top:6px">正確：<b>${esc(q.o[q.ans])}</b>　錯 ${x.n} 次</div><div class="hint">${esc(q.exp)}</div><div class="pills" style="margin-top:8px"><button class="pill s" data-a="gmf" data-v="${esc(x.id)}">${ST.gmf[x.id]?'取消熟悉':'已熟悉'}</button></div></div>`).join('')).join(''):'<p class="hint">目前沒有文法錯題，繼續保持！</p>'}</div>
  <div class="sec"><div class="sh">最近文法練習</div>${hs.length?hs.slice(0,15).map(h=>`<div class="li"><span>${new Date(h.t).toLocaleDateString('zh-TW')}</span><span>${h.ok}／${h.n}（${Math.round(h.ok/h.n*100)}%）</span></div>`).join(''):'<p class="hint">還沒有紀錄</p>'}</div>
  <div class="pills"><button class="pill" data-a="home">← 返回首頁</button></div>`;
  scrollTo(0,0);
}
function gdlg(ti){
  const t=GT[ti];if(!t)return;const d=document.createElement('div');d.className='md';
  d.innerHTML=`<div style="max-height:84vh;overflow:auto;text-align:left;padding:14px">${gcard(t,false)}<div class="row"><button class="btn" data-a="gclose">關閉</button></div></div>`;
  d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);
}
/* ---- 文法學習單 PDF ---- */
let GP={t:'qa'};
function gws(){
  const ts=gsel();
  app.innerHTML=`<h2>🖨️ 文法 A4 學習單</h2><p class="hint">依文法首頁所選範圍（${ts.length} 個主題、可出 ${gqs(ts).length} 題）產生 PDF，題數與難度依首頁「練習設定」（目前 ${GS.n} 題、${GS.lv==='all'?'全部難度':GS.lv+'題'}）。</p><div class="lb">類型</div><div class="pills">${[['pt','文法重點整理'],['q','練習卷'],['qa','練習卷＋解答頁']].map(([k,t])=>pill('gwst',k,t,GP.t===k)).join('')}</div><div class="foot"><button class="pill" data-a="home">返回</button><button class="btn" id="gpdfb" data-a="gpdf">下載 PDF</button></div>`;
  scrollTo(0,0);
}
function gPages(ts,qs,t){
  const gs=uniq(ts.map(x=>x.g+x.b+' '+x.u)),rg=gs.slice(0,4).join('、')+(gs.length>4?'…':'');
  const P='font-family:-apple-system,PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif;width:794px;height:1123px;padding:44px 52px;background:#fff;color:#514746;box-sizing:border-box';
  const hd=s=>`<div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #574B49;padding-bottom:10px;margin-bottom:14px"><div><div style="font-size:26px;font-weight:700">英文文法學習單${s}</div><div style="font-size:13px;color:#958986;margin-top:4px">${esc(rg)}</div></div><div style="font-size:14px;white-space:nowrap;flex:none;margin-left:16px">姓名：＿＿＿＿＿　日期：＿＿＿＿</div></div>`;
  const out=[],pg=(h,b)=>out.push(`<div class="pg" style="${P}">${h}${b}</div>`);
  if(t==='pt'){
    for(let i=0;i<ts.length;i+=2)pg(hd('（文法重點）'),ts.slice(i,i+2).map(x=>`<div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #E9E1DE"><div style="font-size:19px;font-weight:700">${esc(x.name)} <span style="font-size:12px;color:#958986;font-weight:400">${esc(x.u)}</span></div><div style="font-size:14px;line-height:1.7;margin:4px 0">${esc(x.pt)}</div><div style="background:#ECE5F6;border-radius:8px;padding:6px 10px;font-size:14px;margin:6px 0">${esc(x.fm)}</div>${x.ex.map(e=>`<div style="font-size:14px;line-height:1.6">• ${esc(e.s)}　<span style="color:#958986">${esc(e.zh)}</span></div>`).join('')}${x.tp.map(e=>`<div style="font-size:13px;line-height:1.6;margin-top:3px">⚠ ${esc(e)}</div>`).join('')}</div>`).join(''));
    return out.join('');
  }
  const per=7,L='ABCD';
  for(let i=0;i<qs.length;i+=per)pg(hd(''),qs.slice(i,i+per).map((q,j)=>`<div style="margin-bottom:14px"><div style="font-size:16px;line-height:1.7">${i+j+1}. ${esc(q.stem).replace(/___/g,'＿＿＿＿＿')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:15px;margin:4px 0 0 18px">${q.o.map((o,k)=>`<div>(${L[k]}) ${esc(o)}</div>`).join('')}</div></div>`).join(''));
  if(t==='qa')for(let i=0;i<qs.length;i+=9)pg(hd('（解答）'),qs.slice(i,i+9).map((q,j)=>`<div style="margin-bottom:10px;font-size:14px;line-height:1.6"><b>${i+j+1}. ${L[q.ans]}</b>　${esc(q.o[q.ans])}<br><span style="color:#958986">${esc(q.exp)}</span></div>`).join(''));
  return out.join('');
}
async function gmkpdf(){
  const ts=gsel();let qs=gqs(ts);if(!ts.length||(GP.t!=='pt'&&!qs.length)){dlg('請先選擇要列印的文法範圍',[['好',0]]);return}
  if(GP.t!=='pt'){qs=GS.rand?shuffle(qs):qs;qs=qs.slice(0,GS.n)}
  if(!await gdl()){dlg('目前的環境無法下載檔案，請從 claude.ai 開啟這個頁面',[['好',0]]);return}
  const b=$('gpdfb');b.disabled=true;b.textContent='產生中…';
  try{
    await lj('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');await lj('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const box=document.createElement('div');box.style.cssText='position:fixed;left:-9999px;top:0';box.innerHTML=gPages(ts,qs,GP.t);document.body.appendChild(box);
    const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),pg=box.querySelectorAll('.pg');
    for(let i=0;i<pg.length;i++){const c=await html2canvas(pg[i],{scale:2,backgroundColor:'#fff'});if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,595.28,841.89)}
    box.remove();await dsave('英文文法學習單.pdf',doc.output('blob'));
  }catch(e){dlg('產生 PDF 失敗，請稍後再試',[['好',0]])}
  b.disabled=false;b.textContent='下載 PDF';
}
const rg_=()=>{const y=scrollY;(document.getElementById('gq')&&document.querySelector('h1').textContent==='文法總覽'?gov:ghome)();scrollTo(0,y)};
document.addEventListener('input',e=>{if(e.target.id==='gq'){GS.q=e.target.value;gsrch()}});
Object.assign(H,{
  tab:v=>{S.tab=v;home();scrollTo(0,0)},
  gopn:()=>{GS.open=!GS.open;rg_()},govw:()=>{gov();scrollTo(0,0)},
  ggrade:v=>{GS.g=v;rg_()},gbook:v=>{GS.b=v;rg_()},
  gunit:v=>{const k=['翰林',GS.g,GS.b,v].join('|');GS.sel.has(k)?GS.sel.delete(k):GS.sel.add(k);rg_()},
  gallb:()=>{GT.filter(t=>t.g===GS.g&&t.b===GS.b).forEach(t=>GS.sel.add(gk(t)));rg_()},
  gclrb:()=>{GT.filter(t=>t.g===GS.g&&t.b===GS.b).forEach(t=>GS.sel.delete(gk(t)));rg_()},
  gn:v=>{GS.n=+v;rg_()},glv:v=>{GS.lv=v;rg_()},gtg:v=>{GS[v]=!GS[v];rg_()},
  gfam:v=>{const t=GT[+v];ST.gf[t.name]?delete ST.gf[t.name]:ST.gf[t.name]=true;sv();rg_()},
  gone:v=>{const t=GT[+v];grun(shuffle(t.q))},
  ggo,gnb,gws:()=>gws(),gwst:v=>{GP.t=v;gws()},gpdf:gmkpdf,
  gopt:(v,el)=>{const o=Q.o[+v];document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(Q.o[i].ok)b.classList.add('ok')});if(!o.ok)el.classList.add('no');gfb(o.ok,o.t)},
  gtopic:v=>gdlg(+v),gclose:()=>document.querySelectorAll('.md').forEach(e=>e.remove()),
  gretest:()=>grun(Q.rec.filter(r=>!r.ok).map(r=>r.c)),
  gmf:v=>{ST.gmf[v]?delete ST.gmf[v]:ST.gmf[v]=true;sv();gnb()},
  grtnb:()=>{const it=Object.values(ST.gm).filter(x=>GQ[x.id]&&!ST.gmf[x.id]).map(x=>GQ[x.id]);grun(shuffle(it))}
});
home();
</script>
